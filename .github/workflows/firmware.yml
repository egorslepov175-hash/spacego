name: Build SPACEGO QR firmware
on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spacego-qr-firmware
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official build tools
        run: python -m pip install platformio==6.2.0 esptool==4.8.1
      - name: Build classic CYD ILI9341
        working-directory: firmware/SPACEGO_Smart_Lock_QR
        run: pio run -e cyd_ili9341
      - name: Package ILI9341 firmware
        working-directory: firmware/SPACEGO_Smart_Lock_QR
        run: python tools/package_firmware.py --environment cyd_ili9341 --output ../../release
      - name: Build CYD ST7789 revision
        working-directory: firmware/SPACEGO_Smart_Lock_QR
        run: pio run -e cyd_st7789
      - name: Package ST7789 firmware
        working-directory: firmware/SPACEGO_Smart_Lock_QR
        run: python tools/package_firmware.py --environment cyd_st7789 --output ../../release
      - name: Publish downloadable firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="spacego-qr-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          printf 'ESP32-2432S028R. QR only; no touch input and no PIN. Relay GPIO22.\n\nFull .bin: flash at 0x0. App .bin: 0x10000 after bootloader and partitions.\nWi-Fi and enrollment are configured over USB using tools/configure_device.py.\n\nSource commit: %s\n' "$GITHUB_SHA" > release-notes.txt
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "SPACEGO Smart Lock QR — CYD build ${GITHUB_RUN_NUMBER}" --notes-file release-notes.txt
