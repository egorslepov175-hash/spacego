[platformio]
default_envs = cyd_ili9341

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit ILI9341@1.6.1
  adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
  bblanchon/ArduinoJson@7.2.1
  ricmoo/QRCode@0.0.1
  olikraus/U8g2_for_Adafruit_GFX@1.8.0
  bodmer/TJpg_Decoder@1.1.0
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D USER_SETUP_LOADED=1
  -std=gnu++17
build_unflags = -std=gnu++11

[env:cyd_ili9341]
build_flags = ${env.build_flags} -D SPACEGO_TFT_ILI9341=1

[env:cyd_st7789]
build_flags = ${env.build_flags} -D SPACEGO_TFT_ST7789=1

; Some USB-C revisions labelled ESP32-2432S028R use ST7789.
; The default above targets the classic ILI9341 board.
